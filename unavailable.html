<title>Not available</title>
<style>
:root{--bg:#f6f7fb;--card:#fff;--ink:#14171f;--mut:#5b6272;--line:#e6e8f0;--acc:#5b5bf0}
@media(prefers-color-scheme:dark){:root{--bg:#0f1117;--card:#171a23;--ink:#f2f3f7;--mut:#a3a9b8;--line:#272b38;--acc:#8b8bff}}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{display:grid;place-items:center;padding:24px;background:var(--bg);color:var(--ink);font:16px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
main{width:min(460px,100%);text-align:center;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:44px 32px 36px;box-shadow:0 12px 40px #1b1f3a14}
.ic{width:72px;height:72px;margin:0 auto 22px;border-radius:20px;display:grid;place-items:center;background:color-mix(in srgb,var(--acc) 14%,transparent);color:var(--acc)}
.ic svg{width:36px;height:36px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
h1{margin:0 0 10px;font-size:26px;letter-spacing:-.01em}
p{margin:0 auto;max-width:34ch;color:var(--mut)}
a.btn{display:inline-block;margin-top:28px;padding:11px 22px;border-radius:11px;background:var(--acc);color:#fff;font-weight:600;text-decoration:none}
a.btn:hover{filter:brightness(1.08)}
small{display:block;margin-top:22px;color:var(--mut);font-size:13px}
</style>
</head>
<body>

</body>
</html>
