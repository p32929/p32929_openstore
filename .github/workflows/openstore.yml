# Checks your OpenStore files on every push (any branch) and pull request.
# Problems show up in the Actions tab and as notes on the exact lines of your files.
name: OpenStore check

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node validate.mjs
